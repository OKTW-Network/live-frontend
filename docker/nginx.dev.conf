map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 0;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # Video files: live.oktw.one/record/*.mp4 302 → s3.licson.net/oktw-live/*.
  # Proxy S3 directly so the browser stays same-origin (needed for Range + Web Audio).
  location ~* ^/record/(?<record_file>[^/]+\.(mp4|webm|mkv))$ {
    rewrite ^ /oktw-live/$record_file break;
    proxy_pass https://s3.licson.net;
    proxy_ssl_server_name on;
    proxy_set_header Host s3.licson.net;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Do not leak upstream redirects back to the browser.
    proxy_intercept_errors off;
    proxy_redirect off;
  }

  # list.json, thumbnails, and anything else under /record/
  location /record/ {
    proxy_pass https://live.oktw.one;
    proxy_ssl_server_name on;
    proxy_set_header Host live.oktw.one;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /live/ {
    proxy_pass https://live.oktw.one;
    proxy_ssl_server_name on;
    proxy_set_header Host live.oktw.one;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass https://live.oktw.one;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host live.oktw.one;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA + Vite HMR — host Vite on :5173
  location / {
    proxy_pass http://host.docker.internal:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
