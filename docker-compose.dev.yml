# Dev reverse proxy in front of host Vite (:5173).
# Usage:
#   VITE_HMR_CLIENT_PORT=8080 npm run dev -- --host 0.0.0.0 --port 5173
#   docker compose -f docker-compose.dev.yml up
# Then open http://127.0.0.1:8080/ or http://<LAN-IP>:8080/

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: live-frontend-proxy
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
